name: CI

# Branch pushes do not trigger CI: the /pre-pr gate runs the same checks
# locally before a pull request exists, and firing on both `push` and
# `pull_request` would run every job twice for the life of a PR -- the
# concurrency group below cannot dedupe them, because a push is
# refs/heads/<branch> and a pull request is refs/pull/N/merge.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Nothing here writes anything.
permissions:
  contents: read

# A newer push to the same ref makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock disagrees with pyproject.toml. CI must
      # install exactly what a developer installs, or it is testing something
      # nobody runs.
      - name: Install dependencies
        run: uv sync --locked

      # --check, and no --fix: CI reports, it does not mutate. A pipeline that
      # rewrote the tree would hide the fact that the commit was never
      # formatted, and the next developer would meet the diff instead.
      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pyrefly
        run: uv run pyrefly check

  fast-tests:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the tests that need neither a database nor a model
        run: uv run pytest -m "not slow" -q

  full-tests:
    name: Full suite — real database, real models
    # Roughly 1.7 GB of model weights and a Postgres service. Because branch
    # pushes do not reach this workflow, every trigger that does is one worth
    # paying for: a pull request, a merge to main, or a release tag.
    runs-on: ubuntu-latest

    services:
      db:
        # The same image and port as docker-compose.yml, so CI and a laptop
        # are not two different databases.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: go2
          POSTGRES_PASSWORD: go2
          POSTGRES_DB: go2
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U go2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Identical to the default in go2/config.py; stated here so the job reads
      # as self-contained rather than relying on a default matching by luck.
      GO2_DATABASE_URL: postgresql+psycopg://go2:go2@localhost:5433/go2
      GO2_MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # Keyed on config.py, where the model ids live, so changing a model never
      # reuses an entry written for the old one. restore-keys still falls back
      # to the newest cache that exists: the superseded weights come with it,
      # which costs disk and nothing else -- fastembed namespaces weights by
      # model id and downloads the new one beside them.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.model-cache
          key: go2-models-${{ runner.os }}-${{ hashFiles('go2/config.py') }}
          restore-keys: |
            go2-models-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply migrations
        run: uv run go2 migrate

      # test_ingest_e2e.py, test_tenancy.py, test_retrieval.py and
      # test_mcp_server.py each skip themselves when no database answers. That
      # is right on a laptop and wrong here: a misconfigured service would
      # leave this job green having run none of the tests that touch pgvector.
      # The silent pass is the failure mode, so assert reachability rather than
      # assume it -- this is the same SELECT 1 those modules guard on.
      - name: Fail if the database is not reachable
        run: |
          uv run python - <<'PY'
          from sqlalchemy import text

          from go2.storage.db import connect

          with connect() as conn:
              conn.execute(text("SELECT 1"))
          print("database reachable")
          PY

      - name: Run every test
        run: uv run pytest -q

  release:
    name: Build the wheel and publish the release
    # The reason this lives in the CI workflow rather than its own: `needs`
    # only reaches jobs in the same workflow, and a wheel built from a tree
    # whose suite never ran is exactly the artefact you do not want to be
    # holding during a rollback. A separate workflow would start in parallel
    # with the tests and could publish ahead of a red one.
    needs: [toolchain, fast-tests, full-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # The only job that writes anything, and the only one granted it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # A release whose filename disagrees with its tag is the kind of thing
      # nobody notices until they are already debugging the wrong build.
      - name: The tag must match the version in pyproject.toml
        run: |
          declared="$(uv run --no-project python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "pyproject.toml declares $declared but the tag says $tagged" >&2
            exit 1
          fi
          echo "version $declared"

      - name: Build
        run: uv build

      # $GITHUB_REF_NAME as an environment variable, not a ${{ }} expansion:
      # a tag name is chosen by whoever pushes the tag, and must not become
      # shell.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
