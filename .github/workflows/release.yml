name: Release

# There is no deployment target yet: the assistant runs as a uv tool on the
# operator's machine, and hosted deployment is gated behind authentication in
# front of `go2 serve --http` (#16). Until then a release is a wheel with a
# version you can point at, which is what a rollback needs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wheel:
    name: Build the wheel and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # A release whose filename disagrees with its tag is the kind of thing
      # nobody notices until they are already debugging the wrong build.
      - name: The tag must match the version in pyproject.toml
        run: |
          declared="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "pyproject.toml declares $declared but the tag says $tagged" >&2
            exit 1
          fi
          echo "version $declared"

      - name: Build
        run: uv build

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
