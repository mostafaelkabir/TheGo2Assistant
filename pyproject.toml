[project]
name = "go2"
version = "0.1.0"
description = "Ask your assistant about your OneDrive and Google Drive files."
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "fastembed>=0.5",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "google-api-python-client>=2.160",
    "google-auth-oauthlib>=1.2",
    "cryptography>=44.0",
    "typer>=0.15",
    "logfire>=3.0",
    "mcp>=1.2",
]

[project.scripts]
go2 = "go2.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.16",
    "pyrefly>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["go2"]

# --- Lint -------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# The ONLY two suppressions in this project. Both are mandated by Ruff itself:
# COM812 (missing-trailing-comma) and ISC001 (single-line-implicit-string-concat)
# conflict with `ruff format`. See https://docs.astral.sh/ruff/formatter/
# Ruff auto-resolves the mutually exclusive pydocstyle pairs (D203/D211) on its own.
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# Test files, not library code. Each entry is a rule whose purpose does not
# apply here -- none of these are suppressions of a real defect.
"tests/**" = [
    "S101",              # asserts ARE the test
    "PLR2004",           # a literal expectation is clearer than a named constant
    "INP001",            # tests are not a package
    "D101", "D102",      # the test's name is its documentation
    "D103", "D107",
    "ANN401",            # fakes mirror untyped third-party APIs
    "S105", "S106", "S107",  # fixture credentials are fake by construction
    "PLC2701",           # tests may reach into private helpers they cover
    "N815",              # fakes mirror upstream camelCase API names verbatim
]
"go2/storage/migrations/**" = ["INP001"]

[tool.ruff.lint.flake8-type-checking]
# Typer resolves these annotations at runtime, so their imports must stay at
# module scope. Telling Ruff that is a configuration fact, not a suppression.
runtime-evaluated-decorators = ["typer.Typer.command", "typer.Typer.callback"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- Types ------------------------------------------------------------------
[tool.pyrefly]
project-includes = ["go2", "tests"]
python-version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: loads the real embedding model (~600 MB download on first run)",
]
